<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yiët Game Interface</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Times New Roman', Times, serif, sans-serif; 
            background-color: #2b1d0c; 
            background-image: radial-gradient(#3a2712 1px, transparent 0);
            background-size: 20px 20px;
            color: #f3e5ab;
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            padding: 15px 10px; 
            margin: 0;
            overflow-x: hidden;
        }

        .game-container { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            width: 100%;
            max-width: 1000px; 
            margin: 0 auto;
        }

        .board-wrapper { 
            width: 100%; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            text-align: center;
        }

        /* Responsive Wooden Board Styling */
        .yiet-board { 
            display: grid; 
            grid-template-rows: repeat(4, 1fr); 
            gap: clamp(4px, 1.2vw, 12px); 
            background: linear-gradient(135deg, #8B4513, #5c2c06, #a0522d, #421f04);
            padding: clamp(8px, 2vw, 20px); 
            border-radius: 16px; 
            border: clamp(4px, 1vw, 8px) solid #2e1503; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 25px rgba(0,0,0,0.7);
            width: 100%;
        }

        .row-container { 
            display: flex; 
            justify-content: space-between; 
            gap: clamp(2px, 0.8vw, 8px); 
            width: 100%;
        }
        
        /* Scalable Responsive Pit/Hole Styling */
        .hole { 
            flex: 1 1 0;
            width: 100%;
            aspect-ratio: 1 / 1; 
            max-width: 60px;
            max-height: 60px;
            border-radius: 50%; 
            background: radial-gradient(circle at 50% 50%, #1a0d00 0%, #3d1f06 70%, #5c2f0a 100%);
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.9), inset -1px -1px 3px rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.5);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: clamp(10px, 2.2vw, 18px); 
            font-weight: bold;
            color: #fff; 
            text-shadow: 1px 1px 3px #000; 
            position: relative; 
            transition: all 0.2s ease;
            user-select: none;
        }
        
        .hole.empty { 
            background: radial-gradient(circle at 50% 50%, #120900 0%, #291504 80%, #422107 100%);
            color: transparent; 
        }

        /* Player Ring Distinctions */
        .player2 .hole { border: 1.5px solid rgba(30, 144, 255, 0.4); }
        .player1 .hole { border: 1.5px solid rgba(220, 20, 60, 0.4); }
        
        /* Interactive States */
        .hole.interactable { 
            cursor: pointer; 
            border-color: #ffd700; 
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8), 0 0 10px #ffd700; 
        }
        .hole.interactable:hover {
            transform: scale(1.08);
        }
        .hole.active-step { 
            border-color: #00ffff; 
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8), 0 0 12px #00ffff; 
        }
        .hole.origin-step { 
            border-color: #00ff00; 
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8), 0 0 12px #00ff00; 
        }

        /* Minimal UI Panels */
        .panel-wrapper { 
            width: 100%;
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }

        .status-panel, .controls-panel { 
            background-color: #3b2816; 
            padding: 12px clamp(10px, 2vw, 20px); 
            border-radius: 10px; 
            border: 2px solid #5c3a1e; 
            color: #f3e5ab;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .status-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .player-turn { 
            font-size: clamp(0.95em, 2.5vw, 1.1em); 
            font-weight: bold; 
        }

        .phase-badge { 
            padding: 5px 10px; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: clamp(0.75em, 2vw, 0.85em); 
            display: inline-block; 
            margin-top: 6px; 
            text-align: center; 
        }

        .prep-mode { background-color: #78350f; color: #fef3c7; border: 1px solid #f59e0b; }
        .main-mode { background-color: #064e3b; color: #d1fae5; border: 1px solid #10b981; }
        
        .seed-counts { 
            font-size: clamp(0.9em, 2.2vw, 1em);
            font-weight: bold;
        }

        .controls-panel { 
            display: flex; 
            flex-wrap: wrap;
            gap: 10px; 
            justify-content: space-between;
            align-items: center;
        }

        button, select { 
            padding: 8px 12px; 
            border-radius: 5px; 
            border: 1px solid #784824; 
            background-color: #4a321a; 
            color: #f3e5ab; 
            cursor: pointer; 
            font-weight: bold; 
            font-family: 'Times New Roman', Times, serif;
            font-size: clamp(0.8em, 2vw, 0.9em);
        }

        button:hover, select:hover { background-color: #5c3e23; }
        button.ai-btn { background-color: #6d28d9; color: white; border: none; }
        button.ai-btn:hover { background-color: #5b21b6; }
        
        #game-over-msg { 
            font-size: clamp(1em, 2.5vw, 1.3em); 
            font-weight: bold; 
            color: #ef4444; 
            margin-top: 8px; 
            text-align: center; 
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="board-wrapper">
        <h2>Yiët Game Board</h2>
        <div id="yiet-board" class="yiet-board"></div>
        <div id="game-over-msg"></div>
    </div>
    
    <div class="panel-wrapper">
        <div class="status-panel">
            <div class="status-header">
                <span id="player-turn" class="player-turn">Player 1's Turn</span>
                <div class="seed-counts">
                    <span id="p2-seeds">P2: 52</span> | <span id="p1-seeds">P1: 52</span>
                </div>
            </div>
            <div id="phase-badge" class="phase-badge prep-mode">Phase: Preparation (Turn 1/2)</div>
        </div>

        <div class="controls-panel">
            <button id="toggle-ai-btn" class="ai-btn" onclick="toggleAI()">Mode: Play vs AI (P2)</button>
            <select id="difficulty-dropdown" onchange="changeDifficulty(this.value)">
                <option value="easy">AI: Easy</option>
                <option value="medium" selected>AI: Medium</option>
                <option value="hard">AI: Hard</option>
            </select>
            <button onclick="newGame()">New Game</button>
        </div>
    </div>
</div>

<script>
class YietGame {
  constructor() {
    this.board = Array.from({ length: 4 }, () => Array(13).fill(2));
    this.currentPlayer = 1;
    this.gameOver = false;
    this.winner = null;
    this.isPreparationPhase = true;
    this.prepTurnsCount = 0;
    this.tracks = { 1: this._createPlayer1Track(), 2: this._createPlayer2Track() };
  }

  _createPlayer1Track() {
    const track = [];
    for (let c = 12; c >= 0; c--) track.push({ row: 2, col: c, isInner: true });
    for (let c = 0; c <= 12; c++) track.push({ row: 3, col: c, isInner: false });
    return track;
  }

  _createPlayer2Track() {
    const track = [];
    for (let c = 0; c <= 12; c++) track.push({ row: 1, col: c, isInner: true });
    for (let c = 12; c >= 0; c--) track.push({ row: 0, col: c, isInner: false });
    return track;
  }

  _getTrackIndex(player, row, col) { return this.tracks[player].findIndex(pos => pos.row === row && pos.col === col); }
  _getOpponentHoles(player, col) { return player === 1 ? [{ row: 1, col: col }, { row: 0, col: col }] : [{ row: 2, col: col }, { row: 3, col: col }]; }
  
  _checkWinCondition() {
    const p1CanMove = this.tracks[1].some(p => this.board[p.row][p.col] >= 2);
    const p2CanMove = this.tracks[2].some(p => this.board[p.row][p.col] >= 2);

    if (!p1CanMove && !p2CanMove) {
      const p1Seeds = this.tracks[1].reduce((sum, p) => sum + this.board[p.row][p.col], 0);
      const p2Seeds = this.tracks[2].reduce((sum, p) => sum + this.board[p.row][p.col], 0);
      this.gameOver = true;
      this.winner = p1Seeds > p2Seeds ? 1 : (p2Seeds > p1Seeds ? 2 : "Draw");
    } else if (!p1CanMove) {
      this.gameOver = true;
      this.winner = 2;
    } else if (!p2CanMove) {
      this.gameOver = true;
      this.winner = 1;
    }
  }

  makeMove(row, col) {
    if (this.gameOver) return { success: false, error: "Game is over." };
    const track = this.tracks[this.currentPlayer];
    const startIndex = this._getTrackIndex(this.currentPlayer, row, col);
    if (startIndex === -1) return { success: false, error: "Invalid start hole." };
    if (this.board[row][col] < 2) return { success: false, error: "Hole must contain at least 2 seeds to move." };

    let seedsInHand = this.board[row][col];
    this.board[row][col] = 0;

    let sowFromIndex = (startIndex + 1) % 26;
    let legStartSowIndex = sowFromIndex;

    const turnLog = [];
    const moveTrace = [{type: 'start', row: row, col: col, seeds: seedsInHand}];

    while (seedsInHand > 0) {
      let currIndex = (sowFromIndex - 1 + 26) % 26;

      while (seedsInHand > 0) {
        currIndex = (currIndex + 1) % 26;
        const pos = track[currIndex];
        this.board[pos.row][pos.col]++;
        seedsInHand--;
        moveTrace.push({type: 'sow', row: pos.row, col: pos.col, newSeeds: this.board[pos.row][pos.col]});
      }

      const landing = track[currIndex];
      const seedsAtLanding = this.board[landing.row][landing.col];
      let capturedSeeds = 0;

      if (landing.isInner && !this.isPreparationPhase && seedsAtLanding > 1) {
        const [oppInner, oppOuter] = this._getOpponentHoles(this.currentPlayer, landing.col);
        const innerCount = this.board[oppInner.row][oppInner.col];
        const outerCount = this.board[oppOuter.row][oppOuter.col];

        if (innerCount > 0 && outerCount > 0) {
          capturedSeeds = innerCount + outerCount;
          this.board[oppInner.row][oppInner.col] = 0;
          this.board[oppOuter.row][oppOuter.col] = 0;
        }
      }

      if (capturedSeeds > 0) {
        seedsInHand = capturedSeeds;
        sowFromIndex = legStartSowIndex; 
        moveTrace.push({type: 'capture_reset', row: landing.row, col: landing.col, totalCaptured: capturedSeeds, restartRow: track[legStartSowIndex].row, restartCol: track[legStartSowIndex].col});
      } else if (seedsAtLanding > 1) {
        seedsInHand = seedsAtLanding;
        this.board[landing.row][landing.col] = 0;
        sowFromIndex = (currIndex + 1) % 26;
        legStartSowIndex = sowFromIndex;
        moveTrace.push({type: 'relay', row: landing.row, col: landing.col, seedsPickedUp: seedsInHand});
      } else {
        moveTrace.push({type: 'end', row: landing.row, col: landing.col});
        break;
      }
    }

    if (this.isPreparationPhase) {
      this.prepTurnsCount++;
      if (this.prepTurnsCount >= 2) {
        this.isPreparationPhase = false;
      }
    }

    this._checkWinCondition();
    if (!this.gameOver) this.currentPlayer = this.currentPlayer === 1 ? 2 : 1;
    return { success: true, log: turnLog, board: this.board, trace: moveTrace };
  }
}

const gameBoardElement = document.getElementById('yiet-board');
const turnElement = document.getElementById('player-turn');
const p1SeedsElement = document.getElementById('p1-seeds');
const p2SeedsElement = document.getElementById('p2-seeds');
const phaseBadgeElement = document.getElementById('phase-badge');
const toggleAIBtn = document.getElementById('toggle-ai-btn');
const gameOverMsgElement = document.getElementById('game-over-msg');
let game;
let isAIEnabled = true;
let aiDifficulty = 'medium';

function newGame() {
  game = new YietGame();
  gameOverMsgElement.innerText = '';
  updatePhaseUI();
  renderBoard();
}

function toggleAI() {
  isAIEnabled = !isAIEnabled;
  toggleAIBtn.innerText = isAIEnabled ? "Mode: Play vs AI (P2)" : "Mode: 2-Player Pass & Play";
  if (isAIEnabled && game.currentPlayer === 2) triggerAIMove();
}

function changeDifficulty(val) {
  aiDifficulty = val;
}

function updatePhaseUI() {
  if (game.isPreparationPhase) {
    phaseBadgeElement.innerText = `Phase: Preparation (Turn ${game.prepTurnsCount + 1}/2 - No Eating)`;
    phaseBadgeElement.className = "phase-badge prep-mode";
  } else {
    phaseBadgeElement.innerText = "Phase: Main Game (Capturing Active)";
    phaseBadgeElement.className = "phase-badge main-mode";
  }
}

function renderBoard() {
  gameBoardElement.innerHTML = '';
  for (let r = 0; r < 4; r++) {
    const rowDiv = document.createElement('div');
    rowDiv.className = `row-container ${r < 2 ? 'player2' : 'player1'}`;
    for (let c = 0; c < 13; c++) {
      const holeDiv = document.createElement('div');
      const seeds = game.board[r][c];
      holeDiv.className = `hole ${seeds === 0 ? 'empty' : ''}`;
      holeDiv.innerText = seeds === 0 ? '' : seeds;
      holeDiv.id = `hole-${r}-${c}`;
      if (!game.gameOver) {
        const canMoveFromHole = game.currentPlayer === 1 ? (r === 2 || r === 3) : (r === 0 || r === 1);
        const isHumanTurn = !(isAIEnabled && game.currentPlayer === 2);
        if (canMoveFromHole && seeds >= 2 && isHumanTurn) {
          holeDiv.classList.add('interactable');
          holeDiv.onclick = () => handleHoleClick(r, c);
        }
      }
      rowDiv.appendChild(holeDiv);
    }
    gameBoardElement.appendChild(rowDiv);
  }
  turnElement.innerText = `Player ${game.currentPlayer}'s Turn${isAIEnabled && game.currentPlayer === 2 ? ` (AI)` : ''}`;
  p1SeedsElement.innerText = `P1: ${game.tracks[1].reduce((sum, p) => sum + game.board[p.row][p.col], 0)}`;
  p2SeedsElement.innerText = `P2: ${game.tracks[2].reduce((sum, p) => sum + game.board[p.row][p.col], 0)}`;
  
  updatePhaseUI();

  if (game.gameOver) {
    const losingPlayer = game.winner === 1 ? 2 : (game.winner === 2 ? 1 : null);
    if (losingPlayer) {
      gameOverMsgElement.innerText = `Game Over! Player ${game.winner} Wins!`;
    } else {
      gameOverMsgElement.innerText = `Game Over! Draw game.`;
    }
  }
}

function cloneGame(src) {
  const clone = new YietGame();
  clone.board = src.board.map(row => [...row]);
  clone.currentPlayer = src.currentPlayer;
  clone.gameOver = src.gameOver;
  clone.winner = src.winner;
  clone.isPreparationPhase = src.isPreparationPhase;
  clone.prepTurnsCount = src.prepTurnsCount;
  return clone;
}

async function triggerAIMove() {
  if (!isAIEnabled || game.currentPlayer !== 2 || game.gameOver) return;

  turnElement.innerText = `Player 2 (AI Thinking...)`;
  await new Promise(r => setTimeout(r, 600));

  const validMoves = [];
  for (let r = 0; r <= 1; r++) {
    for (let c = 0; c < 13; c++) {
      if (game.board[r][c] >= 2) {
        validMoves.push({ row: r, col: c, seeds: game.board[r][c] });
      }
    }
  }

  if (validMoves.length === 0) return;

  let bestMove = null;

  if (aiDifficulty === 'easy') {
    bestMove = validMoves[Math.floor(Math.random() * validMoves.length)];
  } else if (aiDifficulty === 'medium') {
    let maxCapture = -1;
    for (const move of validMoves) {
      const simGame = cloneGame(game);
      const res = simGame.makeMove(move.row, move.col);
      if (res.success) {
        const totalCaptured = res.trace.filter(t => t.type === 'capture_reset').reduce((sum, t) => sum + t.totalCaptured, 0);
        if (totalCaptured > maxCapture) {
          maxCapture = totalCaptured;
          bestMove = move;
        }
      }
    }
    if (maxCapture <= 0) {
      validMoves.sort((a, b) => b.seeds - a.seeds);
      bestMove = validMoves[0];
    }
  } else if (aiDifficulty === 'hard') {
    let maxNetGain = -Infinity;

    for (const move of validMoves) {
      const simGame = cloneGame(game);
      const res = simGame.makeMove(move.row, move.col);
      if (!res.success) continue;

      const aiCapture = res.trace.filter(t => t.type === 'capture_reset').reduce((sum, t) => sum + t.totalCaptured, 0);

      let maxOpponentCounterCapture = 0;
      if (!simGame.gameOver && simGame.currentPlayer === 1) {
        const oppMoves = [];
        for (let r = 2; r <= 3; r++) {
          for (let c = 0; c < 13; c++) {
            if (simGame.board[r][c] >= 2) oppMoves.push({ row: r, col: c });
          }
        }
        for (const oppMove of oppMoves) {
          const oppSim = cloneGame(simGame);
          const oppRes = oppSim.makeMove(oppMove.row, oppMove.col);
          if (oppRes.success) {
            const oppCap = oppRes.trace.filter(t => t.type === 'capture_reset').reduce((sum, t) => sum + t.totalCaptured, 0);
            if (oppCap > maxOpponentCounterCapture) maxOpponentCounterCapture = oppCap;
          }
        }
      }

      const netGain = aiCapture - (maxOpponentCounterCapture * 1.5) + (move.seeds * 0.1);
      if (netGain > maxNetGain) {
        maxNetGain = netGain;
        bestMove = move;
      }
    }
  }

  if (bestMove) {
    await handleHoleClick(bestMove.row, bestMove.col);
  }
}

async function handleHoleClick(row, col) {
  const allInteractables = document.querySelectorAll('.interactable');
  allInteractables.forEach(h => h.onclick = null); 
  
  const result = game.makeMove(row, col);
  if (!result.success) { renderBoard(); return; } 

  const delay = 140; 

  for (const step of result.trace) {
    if (step.type === 'start') {
        updateHoleVisual(step.row, step.col, 0); 
    } else if (step.type === 'sow') {
        const hole = updateHoleVisual(step.row, step.col, step.newSeeds, true);
        await new Promise(r => setTimeout(r, delay));
        if (hole) hole.classList.remove('active-step');
    } else if (step.type === 'capture_reset') {
        const oppPlayer = game.currentPlayer === 2 ? 1 : 2;
        const [oppInner, oppOuter] = game._getOpponentHoles(oppPlayer, step.col);
        
        const holeInner = updateHoleVisual(oppInner.row, step.col, 0, true);
        const holeOuter = updateHoleVisual(oppOuter.row, step.col, 0, true);
        const restartHole = updateHoleVisual(step.restartRow, step.restartCol, game.board[step.restartRow][step.restartCol], false, true);

        await new Promise(r => setTimeout(r, delay * 2));
        if (holeInner) holeInner.classList.remove('active-step');
        if (holeOuter) holeOuter.classList.remove('active-step');
        if (restartHole) restartHole.classList.remove('origin-step');
    } else if (step.type === 'relay') {
        updateHoleVisual(step.row, step.col, 0);
    }
  }
  renderBoard(); 

  if (isAIEnabled && game.currentPlayer === 2) {
    triggerAIMove();
  }
}

function updateHoleVisual(row, col, seeds, highlight = false, isOrigin = false) {
    const hole = document.getElementById(`hole-${row}-${col}`);
    if (!hole) return null;
    hole.innerText = seeds === 0 ? '' : seeds;
    if (seeds === 0) hole.classList.add('empty'); else hole.classList.remove('empty');
    if (highlight) hole.classList.add('active-step');
    if (isOrigin) hole.classList.add('origin-step');
    return hole;
}

newGame();
</script>

</body>
</html>
